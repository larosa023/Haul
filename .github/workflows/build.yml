name: Build

# Every push builds and tests on Windows. A push to main whose version (src-tauri/tauri.conf.json)
# has no release yet publishes one: the installer, a portable Haul.exe, the browser extension and
# SHA256SUMS.txt. Versions with a "-" (0.2.0-beta.1) are published as pre-releases (Beta channel).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Version
        id: version
        shell: bash
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
          if [[ "$VER" == *-* ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer
        run: npx tauri build

      - name: Collect release files
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/Haul_${ver}_x64-setup.exe" out/
          Copy-Item "src-tauri/target/release/haul.exe" out/Haul.exe
          New-Item -ItemType Directory -Force ext-cr, ext-ff | Out-Null
          Copy-Item -Recurse extension/* ext-cr; Remove-Item ext-cr/manifest.firefox.json
          Copy-Item -Recurse extension/* ext-ff; Move-Item -Force ext-ff/manifest.firefox.json ext-ff/manifest.json
          Compress-Archive -Path ext-cr/* -DestinationPath out/Haul-extension.zip
          Compress-Archive -Path ext-ff/* -DestinationPath out/Haul-extension-firefox.zip
          $lines = Get-ChildItem out -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [IO.File]::WriteAllText("$PWD/out/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content out/SHA256SUMS.txt
          Get-ChildItem out | Format-Table Name, Length

      - name: Smoke test (starts, draws, reports healthy)
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$PWD\smoke"
          New-Item -ItemType Directory -Force smoke\Haul\updates | Out-Null
          $p = Start-Process -FilePath out\Haul.exe -ArgumentList "--after-update","0.0.0-smoke" -PassThru
          $marker = "smoke\Haul\updates\healthy-0.0.0-smoke"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $marker); $i++) { Start-Sleep -Seconds 1 }
          Get-Content smoke\Haul\haul.log -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $marker)) { throw "Haul didn't start and draw its window" }
          Write-Host "Haul started and reported healthy"

      - name: Update test (install, healthy check, and rollback of a broken update)
        shell: pwsh
        run: |
          $root = "$PWD\uptest"
          $env:LOCALAPPDATA = "$root\local"
          $data = "$root\local\Haul"
          New-Item -ItemType Directory -Force "$root\app", "$data\updates\backup", "$root\new" | Out-Null
          Copy-Item out\Haul.exe "$root\app\Haul.exe"
          Copy-Item out\Haul.exe "$data\updates\backup\Haul.exe"
          $orig = (Get-FileHash "$root\app\Haul.exe").Hash
          function Plan($file, $to) {
            @{ portable = $true; file = $file; target_exe = "$root\app\Haul.exe"; install_dir = "$root\app"; backup_dir = "$data\updates\backup";
               from = "0.1.0"; to = $to; parent_pid = 999999; data_dir = $data; guardian = "$root\guard.exe" } | ConvertTo-Json | Set-Content "$root\plan.json"
          }
          Copy-Item out\Haul.exe "$root\guard.exe"

          # 1) A good update: the new version starts and reports healthy.
          Copy-Item out\Haul.exe "$root\new\Haul.exe"
          Plan "$root\new\Haul.exe" "9.9.9"
          $g = Start-Process "$root\guard.exe" -ArgumentList "--guard", "$root\plan.json" -PassThru
          if (-not $g.WaitForExit(120000)) { throw "guardian hung" }
          Get-Process haul -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content "$data\haul.log" -ErrorAction SilentlyContinue
          if ($g.ExitCode -ne 0) { throw "good update: guardian exit $($g.ExitCode)" }

          # 2) A broken update: it exits at once, so the guardian must put the old exe back.
          Copy-Item "$env:SystemRoot\System32\whoami.exe" "$root\new\broken.exe"
          New-Item -ItemType Directory -Force "$data\updates\backup" | Out-Null
          Copy-Item out\Haul.exe "$data\updates\backup\Haul.exe"
          Plan "$root\new\broken.exe" "9.9.8"
          $g = Start-Process "$root\guard.exe" -ArgumentList "--guard", "$root\plan.json" -PassThru
          if (-not $g.WaitForExit(120000)) { throw "guardian hung" }
          Start-Sleep -Seconds 3
          Get-Process haul -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content "$data\haul.log" -ErrorAction SilentlyContinue
          if ($g.ExitCode -ne 2) { throw "broken update: expected rollback (2), got $($g.ExitCode)" }
          if ((Get-FileHash "$root\app\Haul.exe").Hash -ne $orig) { throw "rollback didn't restore Haul.exe" }
          $skip = (Get-Content "$data\settings.json" | ConvertFrom-Json).skipVersion
          if ($skip -ne "9.9.8") { throw "rolled-back version not skipped ($skip)" }
          Write-Host "Update and rollback work"

      - uses: actions/upload-artifact@v4
        with:
          name: haul-${{ steps.version.outputs.version }}
          path: out/*

      - name: Publish release
        if: github.ref == 'refs/heads/main' && steps.version.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=${{ steps.version.outputs.version }}
          NOTES=$(awk -v v="$VER" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          [ -z "$NOTES" ] && NOTES="Haul $VER"
          PRE=""
          [ "${{ steps.version.outputs.pre }}" = "true" ] && PRE="--prerelease"
          gh release create "v$VER" out/* --title "Haul v$VER" --notes "$NOTES" --target "$GITHUB_SHA" $PRE

  torrent-test:
    # Downloads part of a well-seeded public-domain torrent through Haul's engine (real network).
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Real torrent
        working-directory: src-tauri
        env:
          HAUL_TEST_TORRENT: '1'
        run: cargo test --lib real_torrent -- --nocapture --test-threads=1

  net-test:
    # Real network: installs yt-dlp + ffmpeg (SHA-256 checked), downloads and joins an HLS stream,
    # and downloads over FTP and FTPS with resume.
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Video tools, HLS, FTP
        working-directory: src-tauri
        env:
          HAUL_TEST_NET: '1'
        run: cargo test --lib real_ -- --nocapture --test-threads=1 --skip real_torrent
