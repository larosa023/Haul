<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; --bg: #16161a; --surface: #222228; --text: #f2f2f5; --sub: #a8a8b3; --accent: #4f8cff; --line: rgb(255 255 255 / .08); }
  @media (prefers-color-scheme: light) { :root { --bg: #f5f5f7; --surface: #fff; --text: #16161a; --sub: #5c5c68; --line: rgb(0 0 0 / .09); } }
  body { margin: 0; width: 290px; font: 13px 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
  header img { width: 26px; height: 26px; }
  h1 { font-size: 15px; margin: 0; }
  .status { font-size: 12px; color: var(--sub); }
  .ok { color: #5bd18b; } .bad { color: #ff6b6b; }
  .card { margin: 0 12px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; }
  label + label { border-top: 1px solid var(--line); }
  input[type=number], input[type=text] { width: 90px; padding: 4px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input[type=text] { width: 130px; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
  small { display: block; color: var(--sub); padding: 0 16px 12px; font-size: 11.5px; line-height: 1.4; }
</style>
</head>
<body>
  <header><img src="icons/48.png" alt="" /><div><h1>Haul</h1><div id="status" class="status">Checking…</div></div></header>
  <div class="card">
    <label>Send downloads to Haul <input id="enabled" type="checkbox" /></label>
    <label>Skip files smaller than (KB) <input id="minSizeKb" type="number" min="0" /></label>
    <label>Never send these types <input id="skipTypes" type="text" placeholder="e.g. pdf jpg" /></label>
    <label>Haul’s port <input id="port" type="number" min="1024" max="65535" /></label>
  </div>
  <small>Right-click a link for “Download with Haul”. Hold Alt while clicking a link to let the browser download it. When Haul isn’t running, the browser downloads as usual.</small>
  <script src="popup.js"></script>
</body>
</html>
