[package]
name = "haul"
version = "0.4.7"
description = "A clean download manager and torrent client for Windows"
edition = "2021"
rust-version = "1.80"

[lib]
name = "haul_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt", "rt-multi-thread", "fs", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "multipart"] }
futures-util = "0.3"
roxmltree = "0.20"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
anyhow = "1"
url = "2"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma"] }
sevenz-rust2 = { version = "0.20", default-features = false, features = ["util", "bzip2"] }
netdev = "0.47"
base64 = "0.22"
sha1 = "0.10"
suppaftp = { version = "13", default-features = false, features = ["tokio-rustls-ring", "deprecated"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
tauri-winrt-notification = "0.8"
winreg = "0.55"
clipboard-win = "5"
windows-sys = { version = "0.59", features = ["Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_IO", "Win32_Security_Cryptography"] }

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Haul's patches to the torrent engine: Windows adapter binding, MSE encryption,
# per-torrent live limits, file priorities and sequential mode. See vendor/README.md.
[patch.crates-io]
librqbit = { path = "vendor/librqbit" }
librqbit-dualstack-sockets = { path = "vendor/librqbit-dualstack-sockets" }
